<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005338">
  <title>Are you a monster fish?</title>
  <!-- 内嵌图标:展台机器不该为了一个 favicon 多发一次请求 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23005338'/><circle cx='8' cy='8' r='4' fill='%23AADFF6'/></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
.fish-img {
  position: absolute;
  left: 50%;
  width: 55vw;
  height: 12vh;
  transform: translateX(-50%);
  object-fit: contain;
  object-position: center;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity var(--fade-image-ms) ease-out,
    top 420ms ease;
}

.fish-img.is-visible { opacity: 1; }

/* 上层用于淡入的新图 */
#fish-alt { z-index: 2; }
.fish-img[src*="goonch"] {
  transform: translateX(-50%) scale(0.5);
}

.fish-img[src*="american-paddlefish"] {
  transform: translateX(-50%) scale(0.5);
}
.fish-img[src*="arapaima"] {
  transform: translateX(-50%) scale(0.5);
}

.fish-img[src*="giant-barb"] {
  transform: translateX(-50%) scale(1);
}
</style>
</head>
<body>

  <!-- 一面竖屏,版式完全照客户 PDF:上面鱼图,中间标题,下面正文,全部居中。
       data-band  选六套版式之一(idle / waiting / baby / almost / same / beyond)
       data-layout 决定这一屏是"居中列"还是"手工摆位"
       具体尺寸和位置全在 style.css 里,前端只负责切换这两个属性。
       画面上没有任何调试/操作控件 —— 联调请用 Postman 打接口。 -->
  <div id="screen" data-phase="idle" data-band="idle" data-layout="abs">
    <img id="fish" alt="" hidden>

    <h1 id="headline"></h1>
    <p id="text"></p>
    <p id="extra"></p>

    <!-- 客户要求的等待动画:按下按钮后、灯带升起和称重期间显示。
         PDF 的 11 屏里没有这一屏,是客户口头补的中间页。
         "Weighing" 后面三个点由 CSS 依次点亮(css/style.css 的 dot-pulse)。 -->
    <div id="waiting" hidden>
      <span id="waiting-label">Weighing</span>
      <span class="waiting-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
  </div>

  <!-- 文案与分档规则在前端;后端只给重量 -->
  <script src="{{ url_for('static', filename='js/prompts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
